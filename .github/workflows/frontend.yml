name: Frontend previews
on:
  push:
    paths: ['app/**', 'components/**', 'lib/**', 'v*/**', 'tests/frontend/**', 'public/**', 'package*.json', '*.config.*', 'tsconfig.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['app/**', 'components/**', 'lib/**', 'v*/**', 'tests/frontend/**', 'public/**', 'package*.json', '*.config.*', 'tsconfig.json', '.github/workflows/frontend.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-diagnostics-${{ matrix.shard }}
          path: test-results/
          retention-days: 1
