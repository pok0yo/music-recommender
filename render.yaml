services:
  - type: web
    name: music-recommender-api
    runtime: python
    plan: free
    region: ohio
    autoDeployTrigger: 'off'
    buildCommand: pip install --require-hashes --only-binary=:all: -r backend/requirements-production.lock && python -m backend.release_files fetch
    startCommand: python -m backend.production
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RELEASE_STORAGE_BASE_URL
        sync: false
      - key: RELEASE_STORAGE_TOKEN
        sync: false
